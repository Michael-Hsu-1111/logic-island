<title>邏輯冒險島</title>

<style>
:root{color-scheme:light;
 --bg:#fff4dc;--bg2:#ffe7b8;--card:#fffdf8;--ink:#2b2a3a;--mute:#5f5b78;--line:#ecdcb8;
 --accent:#ff7a1a;--accent-d:#d85f00;--ok:#1f9d5a;--ok-d:#157a43;--bad:#e5484d;--half:#f2b705;--blue:#3b82f6;--blue-d:#2563c9;--slot:#f3ead6;
 --r-lg:24px;--r-md:16px;--r-sm:12px;--sh:0 6px 0 rgba(0,0,0,.07),0 14px 28px rgba(43,42,58,.12)}

html{font-size:clamp(17px,.9vw + 11px,22px)}

 padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;line-height:1.55}

.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:1rem;box-shadow:var(--sh)}

.b{border:0;border-radius:var(--r-md);min-height:3rem;padding:.7rem 1.1rem;font-size:1.05rem;font-weight:800;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--accent-d);letter-spacing:.02em;transition:transform .08s,box-shadow .08s}

.b.g{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.b.g:active{box-shadow:0 1px 0 var(--line)}
.b.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.b.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.b.sm{min-height:2.75rem;padding:.5rem .9rem;font-size:.95rem}
.b:disabled{opacity:.4;cursor:default;transform:none}
.b.good{background:#dff6e8;border-color:var(--ok);color:var(--ink);animation:pop .35s}

.b.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.act{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

@keyframes starin{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.4) rotate(8deg)}100%{transform:scale(1)}}

/* 選角 */
.pickl{display:grid;gap:.8rem;margin-top:.6rem}
.hero{display:flex;align-items:center;gap:1rem;text-align:left;font-size:1.3rem}
.hero .av{width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;font-size:2rem;flex:none;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.hero small{display:block;font-weight:600;font-size:.9rem;opacity:.9}
/* 首頁 */
.hud{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.me{display:flex;align-items:center;gap:.6rem;font-weight:800;min-width:0}
.me .av{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.12);flex:none}
.stat{font-size:.95rem;color:var(--mute);font-weight:700}
.hudb{display:flex;gap:.4rem}
.guide{display:flex;gap:.7rem;align-items:flex-end;margin:.4rem 0 .8rem}

.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:var(--r-md);padding:.7rem .9rem;font-size:1rem;font-weight:600;box-shadow:0 3px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.big{width:100%;font-size:1.25rem;min-height:3.6rem}
.path{position:relative;display:grid;gap:1.4rem;padding:1.2rem 0 .4rem;margin-top:.4rem}
.path::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:0;border-left:6px dotted #e0c98f;transform:translateX(-50%)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:.3rem;background:none;border:0;cursor:pointer;color:var(--ink);padding:0}
.node .ic{width:5.8rem;height:5.8rem;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;border:5px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.16);transition:transform .1s}
.node:active .ic{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.node.new .ic{animation:pulse 1.4s infinite}
.node.lock{cursor:default}.node.lock .ic{filter:grayscale(1);opacity:.6}

.node small{font-weight:700;color:var(--mute);font-size:.85rem}
.node:nth-child(4n+2){transform:translateX(-22%)}.node:nth-child(4n+4){transform:translateX(22%)}
/* 面板 */
#ov{position:fixed;inset:0;background:#2b2a3aee;backdrop-filter:blur(6px);display:grid;place-items:start center;overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-left,0px)) 40px;z-index:20}
.panel{background:var(--card);border-radius:var(--r-lg);padding:1.1rem;width:100%;max-width:min(720px,96vw);border:3px solid var(--line);box-shadow:var(--sh);animation:up .25s ease-out;min-height:min(70dvh,560px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap}
.top b{font-size:1.05rem}
.dots{display:flex;gap:.3rem}.dots i{width:.7rem;height:.7rem;border-radius:50%;background:var(--slot);border:2px solid var(--line)}.dots i.on{background:var(--ok);border-color:var(--ok)}.dots i.cur{background:var(--half);border-color:var(--half)}
.q{font-size:clamp(1.25rem,1.6vw + .9rem,1.8rem);line-height:1.7;margin:.8rem 0;font-weight:800}
.qrow{display:flex;gap:.5rem;align-items:flex-start;justify-content:space-between}
.opts{display:grid;gap:.6rem}
.opts .b{text-align:left;font-size:1.1rem}
.inrow{display:flex;gap:.6rem;margin:.6rem 0}.inrow input{flex:1;min-width:0}
input[type=text],textarea{width:100%;font-size:1.2rem;padding:.7rem .9rem;border-radius:var(--r-sm);border:3px solid var(--line);background:#fff;color:var(--ink)}
textarea{resize:vertical;margin:.5rem 0}
.msg{min-height:2.4rem;margin:.5rem 0;padding:.5rem .8rem;border-radius:var(--r-sm);font-weight:700;font-size:1.02rem;display:none}
.msg.show{display:block}.msg.bad{background:#ffe3e3}.msg.hint{background:#fff3d6}.msg.ok{background:#dff6e8}
.res{text-align:center}
.res h2{margin:.4rem 0;font-size:1.5rem}
.owl{width:7rem;height:7rem;margin:0 auto;display:block}
.stars{font-size:2.6rem;letter-spacing:.2rem}.stars span{display:inline-block;animation:starin .5s both}
.tip{background:var(--slot);border-radius:var(--r-md);padding:.7rem .9rem;font-size:1rem;line-height:1.7;text-align:left;margin:.7rem 0}
.lvup{background:linear-gradient(90deg,#ffe08a,#ffb347);border-radius:var(--r-md);padding:.6rem;font-weight:900;font-size:1.2rem;margin:.5rem 0;animation:pop .6s}
.note{font-size:.9rem;color:var(--mute);margin:.5rem 0;line-height:1.6}
.stg{display:grid;gap:.7rem;margin:.8rem 0}
.stg button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.stg small{display:block;font-weight:600;opacity:.85;font-size:.85rem}
.lvbar{height:.55rem;border-radius:99px;background:var(--slot);overflow:hidden;margin-top:.3rem}.lvbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.chip{border:2px solid var(--line);background:var(--slot);color:var(--ink);border-radius:999px;min-height:2.4rem;padding:.3rem .8rem;margin:.15rem;font-size:.9rem;cursor:pointer}
.gl{margin:.5rem 0;font-size:.9rem;line-height:2.2;text-align:left}.gl:empty{display:none}
ul{padding-left:1.3rem;line-height:1.8;margin:.3rem 0}
h3{margin:.9rem 0 .2rem;font-size:1.05rem}
/* 密碼島 */
.legend{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;margin:.4rem 0;font-size:.85rem}
.tag{padding:.15rem .6rem;border-radius:999px;color:#fff;font-weight:800;white-space:nowrap;font-size:.85rem}
.tag.g{background:var(--ok)}.tag.y{background:#c98f00}.tag.n{background:var(--mute)}
.rows{display:grid;gap:.4rem;margin:.6rem 0}
.row{display:flex;align-items:center;gap:.5rem;min-width:0}
.rn{width:1.2rem;color:var(--mute);font-size:.8rem;text-align:center;flex:none}
.pegs{display:flex;gap:.35rem;flex:none}
.peg{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;color:#fff;font-weight:900;background:var(--slot);border:3px solid var(--line);position:relative}
.cur .peg{width:3rem;height:3rem;cursor:pointer}
.pal{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin:.6rem 0}
.pal .peg{width:3.1rem;height:3.1rem;cursor:pointer;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.pal .peg.cut{opacity:.4;filter:grayscale(1)}
.pal .peg.cut::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:1.8rem;color:#2b2a3a}
.fb{margin-left:auto;display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.demo{display:flex;align-items:center;gap:.5rem;justify-content:center;margin:.3rem 0;flex-wrap:wrap}
#rem{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:40;background:#2b2a3a;color:#fff;border-radius:var(--r-md);padding:.7rem 1rem;max-width:92%;font-size:.95rem;text-align:center;box-shadow:var(--sh)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2a3a;color:#fff;padding:.6rem 1rem;border-radius:999px;font-size:.95rem;z-index:50;max-width:92%;text-align:center}
.conf{position:fixed;top:-20px;width:.7rem;height:1.1rem;z-index:60;animation:fall 1.8s ease-in forwards;pointer-events:none}
.tb{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:.95rem}.tb th,.tb td{border:2px solid var(--line);padding:.35rem .5rem;text-align:left}.tb th{background:var(--slot)}
.bars{display:flex;gap:1.2rem;align-items:flex-end;height:9rem;border-bottom:3px solid var(--line);margin:.6rem 0 .2rem;padding:0 .5rem}.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bar i{display:block;width:60%;background:var(--blue);border-radius:8px 8px 0 0}.bar b{font-size:.85rem;text-align:center;margin-top:.2rem}
.nbrow{display:flex;gap:.4rem;align-items:center;margin:.2rem 0}.nbrow span{min-width:3.6rem;font-weight:700}.chip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.en{font-size:.72em;opacity:.75;font-weight:600;margin-left:.25em}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var RNG=Math.random;function seedRNG(s){var a=s>>>0;RNG=function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function unseedRNG(){RNG=Math.random}
/* ===== 無限出題 v4（白話版，答案位置與正解不再有規律）：10 級 ≈ 國小低年級 → 國中進階／高中入門（持續擴充） ===== */
function R(a,b){return a+Math.floor(RNG()*(b-a+1))}
function pick(a){return a[R(0,a.length-1)]}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=R(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)}
function fr(n,d){var g=gcd(n,d)||1;n/=g;d/=g;return d===1?String(n):n+"/"+d}
function fm(x){return String(Math.round(x*100)/100)}
function fact(s,b){return "「"+s+"」"+(b?"是真的":"不是真的")}
function mk(t,q,ans,wr,w,tol){
 ans=String(ans);var seen={};seen[ans]=1;var ws=[];
 wr.forEach(function(x){x=String(x);if(!seen[x]&&x.indexOf("NaN")<0){seen[x]=1;ws.push(x)}});
 var isNum=!isNaN(+ans)&&ans.indexOf("/")<0;
 if(ws.length<3&&(ans.indexOf("/")>-1||ans==="1")){["1/2","1/3","1/4","2/3","3/4","1/6","1/5","1/8"].forEach(function(c){if(ws.length<3&&!seen[c]){seen[c]=1;ws.push(c)}})}
 if(ws.length<3&&ans.indexOf("%")>-1){["10%","25%","50%","75%","90%","99%","1%"].forEach(function(c){if(ws.length<3&&!seen[c]){seen[c]=1;ws.push(c)}})}
 if(isNum){
  var k=1,tries=0,isInt=Math.round(+ans)===+ans;
  while(ws.length<3&&tries<60){var c=+ans+(k%2?1:-1)*Math.ceil(k/2);k++;tries++;if(c<0&&+ans>=0)continue;var cs=isInt?String(Math.round(c)):fm(c);if(!seen[cs]){seen[cs]=1;ws.push(cs)}}
  ws=ws.slice(0,3);
  /* 正解不要永遠最大或最小：讓錯誤選項分布在答案兩邊 */
  if(ws.length>=3){
   var an=+ans,del=Math.max(1,Math.round(Math.abs(an)*.15)),ns=ws.map(Number);
   var allHi=ns.every(function(x){return x>an}),allLo=ns.every(function(x){return x<an});
   function fmt(v){return isInt?String(Math.round(v)):fm(v)}
   if(allHi){var c1=an-del;if(!(an>=0&&c1<0)&&ws.indexOf(fmt(c1))<0){ws[ns.indexOf(Math.max.apply(null,ns))]=fmt(c1)}}
   else if(allLo){var c2=an+del;if(ws.indexOf(fmt(c2))<0){ws[ns.indexOf(Math.min.apply(null,ns))]=fmt(c2)}}
  }
 }
 ws=ws.slice(0,3);
 var o=shuf([ans].concat(ws));
 var r={t:t,q:q,o:o,a:o.indexOf(ans),w:w};if(tol)r.tol=tol;return r;
}
var G={};
G.seq=function(L){
 var a,d,s,n,ans;
 if(L<=1){
  if(RNG()<.35){a=R(20,40);d=R(2,4);s=[a,a-d,a-2*d,a-3*d];ans=a-4*d;return mk("數列",s.join("、")+"、？　問號是哪個數字？",ans,[ans+d,ans-1,ans+1],"每次都少 "+d+"："+s[3]+" － "+d+" ＝ "+ans+"。")}
  a=R(1,10);d=R(2,5);s=[a,a+d,a+2*d,a+3*d];ans=a+4*d;
  return mk("數列",s.join("、")+"、？　問號是哪個數字？",ans,[ans+1,ans-1,ans+d],"每次都多 "+d+"："+s[3]+" ＋ "+d+" ＝ "+ans+"。")}
 if(L===2){
  if(RNG()<.5){a=R(1,4);d=R(2,3);s=[a,a*d,a*d*d,a*d*d*d];ans=s[3]*d;
   return mk("數列",s.join("、")+"、？　問號是哪個數字？",ans,[ans+d,ans-d,s[3]+d],"每次都變成 "+d+" 倍："+s[3]+" × "+d+" ＝ "+ans+"。")}
  a=R(35,60);d=R(3,7);s=[a,a-d,a-2*d,a-3*d];ans=a-4*d;
  return mk("數列",s.join("、")+"、？　問號是哪個數字？",ans,[ans+2*d,ans-d,ans+1],"每次都少 "+d+"："+s[3]+" － "+d+" ＝ "+ans+"。")}
 if(L===3){a=R(1,6);d=R(1,2);s=[a,a+d,a+3*d,a+6*d,a+10*d];ans=a+15*d;
  return mk("數列",s.join("、")+"、？　問號是哪個數字？",ans,[a+14*d,a+16*d,a+13*d],"每次多的數字是 "+d+"、"+2*d+"、"+3*d+"、"+4*d+"，一次比一次多 "+d+"。下一個要多 "+5*d+"："+s[4]+" ＋ "+5*d+" ＝ "+ans+"。")}
 if(L===4){a=R(1,4);var b=R(2,5);s=[a,b,a+b,a+2*b,2*a+3*b];ans=3*a+5*b;
  return mk("數列",s.join("、")+"、？　問號是哪個數字？（提示：第 3 個數字 "+(a+b)+"，是前面兩個數字 "+a+" 和 "+b+" 的什麼？試試看相加）",ans,[ans-1,ans+1,s[4]+s[3]+1],"從第 3 個數字開始，每個數字都是「前面兩個數字相加」："+s[3]+" ＋ "+s[4]+" ＝ "+ans+"。")}
 if(L===5){a=R(1,9);d=R(2,4);var b2=R(20,40),e=R(2,5);s=[a,b2,a+d,b2+e,a+2*d,b2+2*e];ans=a+3*d;
  return mk("數列",s.join("、")+"、？　問號是哪個數字？（這一排數字有兩組規律，輪流出現）",ans,[b2+3*e,ans+1,ans-1],"第 1、3、5 個數字是 "+a+"、"+(a+d)+"、"+(a+2*d)+"，每次多 "+d+"；第 2、4、6 個數字是 "+b2+"、"+(b2+e)+"、"+(b2+2*e)+"，每次多 "+e+"。問號是第 7 個，輪到第一組：下一個是 "+(a+2*d)+" ＋ "+d+" ＝ "+ans+"。")}

}

function score(g,s){
 var a=0,b=0,gs=[],ss2=[],i;
 for(i=0;i<g.length;i++){if(g[i]===s[i])a++;else{gs.push(g[i]);ss2.push(s[i])}}
 gs.forEach(function(x){var k=ss2.indexOf(x);if(k>-1){b++;ss2.splice(k,1)}});
 return [a,b];
}
function codeGo(){
 var L=LV[cs.lv],g=cs.cur.slice(0,L.len),i,j;
 if(!L.rep){for(i=0;i<g.length;i++)for(j=i+1;j<g.length;j++)if(g[i]===g[j]){cs.msg="這一關每個顏色只能用一次喔。";drawCode();sBad();return}}
 for(i=0;i<cs.hist.length;i++)if(cs.hist[i].g.join()===g.join()){cs.msg="這個猜測你已經試過了，換一個吧。";drawCode();sBad();return}
 var s=score(g,cs.secret);
 cs.hist.push({g:g,s:s});cs.cur=[];
 if(s[0]===L.len){codeEnd(true);return}
 if(cs.hist.length>=L.max){codeEnd(false);return}
 sfx(300+s[0]*160,.2);
 cs.msg=(s[0]+s[1]===0)?"哇！這幾個顏色都不是，可以全部劃掉了 ✂️":"想一想：哪個位置可能是對的？";
 drawCode();
}
function codeEnd(ok){
 var L=LV[cs.lv],n=cs.hist.length,i=cs.lv,st=0,nx=i+1<WORLDS.code.ns;
 var ans='<div class="pegs" style="justify-content:center;margin:.5rem 0">'+cs.secret.map(pgs).join('')+'</div>';
 var tip=CTIPS[Math.floor(Math.random()*CTIPS.length)];
 if(ok){
  st=n<=Math.ceil(L.max/2)?3:(n<L.max-1?2:1);if(cs.hint&&st>1)st--;
  saveStar("code",i,st);ss("b_n",num("b_n")+1);ss("b_g",num("b_g")+n);if(cs.hint)ss("b_h",num("b_h")+1);
  sWin();confetti(60);
 }else sBad();
 openP('<div class="res">'+owl(ok?"happy":"think","owl")+'<h2>'+(ok?(n===1?"一次就中！太神啦！":"破解成功！"):"差一點點！")+'</h2>'+(ok?'<div class="stars">'+[1,2,3].map(function(k){return '<span style="animation-delay:'+k*.2+'s;opacity:'+(k<=st?1:.25)+'">⭐</span>'}).join("")+'</div>':'')+
  '<p class="note">'+(ok?"你用了 "+n+" 次猜中。":"正確答案是下面這排。每次的密碼都不一樣，再試一次！")+'</p>'+ans+'<div class="tip">'+tip+'</div><div class="act">'+(ok&&nx?'<button class="b ok" data-a="stnext">下一關 Next →</button>':'')+(ok?'':'<button class="b" data-a="stagain">再試一次 Retry</button>')+'<button class="b g" data-a="menu">關卡列表 Levels</button><button class="b g" data-a="close">回地圖 Map</button></div></div>');
}

function exportAll(){
 var o={},keys=[];
 try{for(var i=0;i<localStorage.length;i++)keys.push(localStorage.key(i))}catch(e){}
 Object.keys(mem).forEach(function(k){if(keys.indexOf(k)<0)keys.push(k)});
 keys.forEach(function(k){if(/^(波妞|Hana|Joy)_/.test(k)){try{o[k]=localStorage.getItem(k)}catch(e){o[k]=mem[k]}}});
 return JSON.stringify({app:"logic-world",v:2,data:o});
}
function importAll(t){
 var j;try{j=JSON.parse(t)}catch(e){return false}
 if(!j||j.app!=="logic-world"||!j.data)return false;
 Object.keys(j.data).forEach(function(k){if(/^(波妞|Hana|Joy)_/.test(k)&&j.data[k]!==null){mem[k]=String(j.data[k]);try{localStorage.setItem(k,String(j.data[k]))}catch(e){}}});
 return true;
}

function todayStr(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function hashStr(s){var h=2166136261,i;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dcStart(){
 if(sg("dc_last")===todayStr()){openP('<div class="res">'+owl("happy","owl")+'<h2>今天的挑戰完成了！</h2><div class="tip">🔥 連續 '+num("dc_streak")+' 天。明天再來！<br>想繼續練習，可以去訓練場。</div><div class="act"><button class="b ok" data-a="train">去訓練場</button><button class="b g" data-a="close">回地圖 Map</button></div></div>');return}
 seedRNG(hashStr(P+todayStr()));
 var list=[],i;
 for(i=0;i<5;i++){var sk=SK[R(0,SK.length-1)],lv=lvOf(sk.id);list.push({sk:sk,lv:lv,q:sk.g(lv)})}
 unseedRNG();
 TR={ids:SK.map(function(s){return s.id}),count:5,idx:0,ok:0,up:[],down:0,daily:true,list:list};trainNext();
}

}
